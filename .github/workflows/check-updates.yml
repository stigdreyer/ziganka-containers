name: Check for container image updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-check-image-updates
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    uses: halos-org/shared-workflows/.github/workflows/check-image-updates.yml@b295aae0fffe2f7d705a4e70fd32e00f37c705f7 # main as of 2026-10-20 (GHCR pagination fix, shared-workflows#31)
    with:
      compose-pattern: 'apps/*/docker-compose.yml'
